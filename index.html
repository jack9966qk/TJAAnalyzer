<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TJA Analyzer</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TJA Analyzer">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="/assets/icon_simple-BOyTaIRg.png">
    <link rel="icon" type="image/png" href="/assets/icon_simple-BOyTaIRg.png">
    <style>
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 1.5em;
      color: #333333;
    }

    #loading-screen > div {
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    @media (prefers-color-scheme: dark) {
      #loading-screen {
        background-color: #1e1e1e;
        color: #eeeeee;
      }
    }
    </style>
    <script type="module" crossorigin src="/assets/main-C2284wVQ.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/tja-parser-DTJsXAoD.js">
    <link rel="modulepreload" crossorigin href="/assets/internal-BIbZuc_L.js">
    <link rel="modulepreload" crossorigin href="/assets/note-stats-B3P7R43v.js">
    <link rel="modulepreload" crossorigin href="/assets/tja-chart-BCbCVFeL.js">
    <link rel="modulepreload" crossorigin href="/assets/changelog-panel-CERp1kYz.js">
    <link rel="stylesheet" crossorigin href="/assets/style-Ca6QQJmb.css">
  <link rel="manifest" href="/manifest.json"></head>

  <body>
    <div id="loading-screen">
      <div>Loading...</div>
    </div>
    <script>
    setTimeout(() => {
      var el = document.querySelector("#loading-screen > div");
      if (el) el.style.opacity = "1";
    }, 1000);
    </script>
    <div id="safe-area-cover"></div>
    <div id="app">
      <div id="controls-container">
        <div class="app-header">
          <h1>TJA Analyzer</h1>
          <div style="display: flex; gap: 10px; align-items: center;">
            <language-selector id="language-selector"></language-selector>
            <settings-panel id="settings-panel"></settings-panel>
          </div>
        </div>

        <div id="data-source-panel">
          <div class="panel-header" id="ds-panel-header">
            <div class="panel-header-left">
              <h2 data-i18n="ui.dataSource">Data Source</h2>
              <span id="status-display" data-i18n="status.initializing">Initializing...</span>
            </div>
            <img
              id="ds-collapse-icon"
              class="collapse-icon"
              src="assets/heroicons/optimized/24/outline/chevron-down.svg"
              alt="Expand"
            >
          </div>

          <div id="ds-body" class="panel-body collapsed">
            <div class="panel-inner">
              <div class="panel-tabs">
                <button class="panel-tab" data-mode="list" data-i18n="ui.tab.list">List</button>
                <button class="panel-tab" data-mode="file" data-i18n="ui.tab.file">File</button>
                <button class="panel-tab" data-mode="stream" data-i18n="ui.tab.stream">Stream</button>
                <button class="panel-tab" data-mode="tester" data-i18n="ui.tab.tester" style="display:none;">
                  Tester
                </button>
              </div>

              <div class="panel-content">
                <!-- Chart List Mode (Merged Example + ESE) -->
                <div id="tab-list" class="panel-pane">
                  <chart-list-panel id="chart-list-panel"></chart-list-panel>
                </div>

                <!-- File Mode -->
                <local-file-panel id="tab-file" class="panel-pane" style="display:none;"></local-file-panel>

                <!-- Stream Mode (Merged) -->
                <stream-panel id="tab-stream" class="panel-pane" style="display:none;"></stream-panel>

                <!-- Tester Mode -->
                <tester-panel id="tab-tester" class="panel-pane" style="display:none;"></tester-panel>

                <!-- Shared Course & Branch Selector -->
                <course-branch-select id="course-branch-select"></course-branch-select>
              </div>
            </div>
          </div>
        </div>

        <div id="sticky-header">
          <div id="chart-options-panel" class="options-panel">
            <div class="panel-header" id="options-panel-header">
              <div class="panel-header-left">
                <h3 data-i18n="ui.chartOptions">Chart Options</h3>
                <span id="chart-mode-status"></span>
              </div>
              <img
                id="options-collapse-icon"
                class="collapse-icon"
                src="assets/heroicons/optimized/24/outline/chevron-down.svg"
                alt="Expand"
              >
            </div>
            <div id="options-body" class="panel-body collapsed">
              <div class="panel-inner">
                <div class="panel-tabs">
                  <button class="panel-tab active" data-do-tab="view" data-i18n="ui.tab.view">View</button>
                  <button class="panel-tab" data-do-tab="judgements" data-i18n="ui.tab.judgements">Judgements</button>
                  <button class="panel-tab" data-do-tab="selection" data-i18n="ui.tab.select">Select</button>
                  <button class="panel-tab" data-do-tab="annotation" data-i18n="ui.tab.annotate">Annotate</button>
                </div>

                <div class="panel-content">
                  <!-- View Options Pane -->
                  <div id="do-tab-view" class="panel-pane" style="display:flex;">
                    <view-options></view-options>
                  </div>

                  <!-- Judgements Pane -->
                  <div id="do-tab-judgements" class="panel-pane" style="display:none;">
                    <judgement-options></judgement-options>
                  </div>

                  <!-- Note Selection Pane -->
                  <div id="do-tab-selection" class="panel-pane" style="display:none;">
                    <select-options></select-options>
                  </div>

                  <!-- Annotation Pane -->
                  <div id="do-tab-annotation" class="panel-pane" style="display:none;">
                    <annotate-options></annotate-options>
                  </div>

                  <chart-options-footer></chart-options-footer>
                </div><!-- End panel-content -->
              </div>
            </div><!-- End options-body -->
          </div><!-- End chart-options-panel -->
          <note-stats id="note-stats-display"></note-stats>
        </div><!-- End sticky-header -->
      </div><!-- End controls-container -->
      <button id="layout-toggle-btn" title="Collapse">
        <div class="icon-chevron-left"></div>
      </button>

      <div id="chart-container">
        <div class="canvas-container">
          <tja-chart id="chart-component"></tja-chart>
        </div>

        <div class="app-footer">
          <div class="footer-left">
            <span id="app-version">v0.0.0</span>
            <span class="separator">|</span>
            <span>Made by Jack</span>
          </div>
          <changelog-panel></changelog-panel>
        </div>
      </div>
    </div>

    <script src="__neutralino_globals.js"></script>
  </body>
</html>
