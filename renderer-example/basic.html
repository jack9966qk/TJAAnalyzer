<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJA Renderer Example</title>
    <style>
    body {
      margin: 0;
      padding: 0;
      background: #f0f0f0;
      /* Enable vertical scroll, but hide horizontal overflow if any */
      overflow-y: auto;
      overflow-x: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      /* Height will be set dynamically by the renderer */
    }
    </style>
  </head>
  <body>
    <div style="position: sticky; top: 0; background: #fff; padding: 10px; border-bottom: 1px solid #ccc; z-index: 100;">
      <a href="index.html" style="font-family: sans-serif; text-decoration: none; color: #333;">→ Go to Playground</a>
    </div>
    <canvas id="chart-canvas"></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
